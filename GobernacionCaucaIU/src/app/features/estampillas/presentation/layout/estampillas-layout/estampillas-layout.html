<div class="flex h-screen w-screen overflow-hidden bg-slate-100 font-sans antialiased text-slate-800">
  
  <!-- Sidebar Contenedor con Transición Responsiva -->
  <div 
    class="shrink-0 transition-all duration-300 relative z-30"
    [ngClass]="{
      'w-64': !isSidebarCollapsed(),
      'w-16': isSidebarCollapsed()
    }"
  >
    <app-estampillas-sidebar 
      [isCollapsed]="isSidebarCollapsed()" 
      (toggleCollapse)="toggleSidebar()" 
    />
  </div>

  <!-- Contenido Principal: Header Superior + Vista Central con Scroll Independiente -->
  <div class="flex flex-col flex-1 min-w-0 h-screen overflow-hidden">
    
    <!-- Topbar Fijo -->
    <app-estampillas-topbar 
      (toggleSidebar)="toggleSidebar()" 
    />

    <!-- Área de Enrutamiento Central -->
    <main class="flex-1 overflow-y-auto overflow-x-hidden p-4 sm:p-6 lg:p-8 bg-slate-50">
      <div class="max-w-7xl mx-auto">
        <router-outlet></router-outlet>
      </div>
    </main>

  </div>

</div>
