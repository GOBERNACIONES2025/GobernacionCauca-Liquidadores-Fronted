<div class="min-h-screen bg-slate-900 flex flex-col justify-center items-center p-4 select-none relative overflow-hidden">
  
  <!-- Contenedor Principal Login -->
  <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden relative z-10 animate-fadeIn">
    
    <!-- Encabezado Institucional -->
    <div class="bg-[#1b53ad] text-white p-6 text-center border-b-4 border-emerald-500 relative">
      <div class="w-16 h-16 bg-white rounded-xl mx-auto p-1.5 shadow-md flex items-center justify-center mb-3">
        <img src="/Logo_gov_cauca.png" alt="Gobernación del Cauca" class="max-h-full max-w-full object-contain" />
      </div>
      <h1 class="text-sm uppercase tracking-widest font-black text-emerald-300">Gobernación del Cauca</h1>
      <h2 class="text-lg font-bold text-white leading-tight mt-0.5">Módulo de Impuesto de Estampillas</h2>
      <p class="text-xs text-blue-200 mt-1">Plataforma Departamental de Liquidación y Rentas</p>
    </div>

    <!-- Formulario de Acceso -->
    <div class="p-6 sm:p-8 space-y-6">
      
      <!-- Usuarios Demo Rápidos (1-Click) -->
      <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs">
        <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-2 text-center">
          Acceso Rápido de Demostración (Roles MOCK)
        </span>
        <div class="grid grid-cols-2 gap-2">
          <button
            type="button"
            (click)="fillQuickUser('admin', 'ADMINISTRADOR')"
            class="px-2.5 py-1.5 bg-white hover:bg-blue-50 border border-slate-300 hover:border-blue-400 rounded-lg font-semibold text-slate-700 flex items-center gap-1.5 transition text-[11px] cursor-pointer"
          >
            <span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
            <span class="truncate">Administrador</span>
          </button>
          <button
            type="button"
            (click)="fillQuickUser('liquidador', 'LIQUIDADOR')"
            class="px-2.5 py-1.5 bg-white hover:bg-blue-50 border border-slate-300 hover:border-blue-400 rounded-lg font-semibold text-slate-700 flex items-center gap-1.5 transition text-[11px] cursor-pointer"
          >
            <span class="w-2 h-2 rounded-full bg-blue-500 shrink-0"></span>
            <span class="truncate">Liquidador</span>
          </button>
          <button
            type="button"
            (click)="fillQuickUser('funcionario', 'FUNCIONARIO')"
            class="px-2.5 py-1.5 bg-white hover:bg-blue-50 border border-slate-300 hover:border-blue-400 rounded-lg font-semibold text-slate-700 flex items-center gap-1.5 transition text-[11px] cursor-pointer"
          >
            <span class="w-2 h-2 rounded-full bg-amber-500 shrink-0"></span>
            <span class="truncate">Funcionario</span>
          </button>
          <button
            type="button"
            (click)="fillQuickUser('consulta', 'CONSULTA')"
            class="px-2.5 py-1.5 bg-white hover:bg-blue-50 border border-slate-300 hover:border-blue-400 rounded-lg font-semibold text-slate-700 flex items-center gap-1.5 transition text-[11px] cursor-pointer"
          >
            <span class="w-2 h-2 rounded-full bg-purple-500 shrink-0"></span>
            <span class="truncate">Consulta / Auditor</span>
          </button>
        </div>
      </div>

      <!-- Formulario Login -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4 text-xs">
        
        <!-- Campo Usuario -->
        <div>
          <label class="block font-bold text-slate-700 mb-1">Usuario Institucional</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </span>
            <input
              type="text"
              formControlName="usuario"
              placeholder="Ej: admin, liquidador, funcionario"
              class="w-full pl-9 pr-3 py-2.5 border rounded-lg text-xs font-semibold focus:ring-2 focus:ring-blue-500 focus:outline-none"
              [ngClass]="loginForm.get('usuario')?.invalid && loginForm.get('usuario')?.touched ? 'border-rose-400 bg-rose-50' : 'border-slate-300'"
            />
          </div>
        </div>

        <!-- Campo Contraseña -->
        <div>
          <label class="block font-bold text-slate-700 mb-1">Contraseña</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </span>
            <input
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="clave"
              placeholder="••••••"
              class="w-full pl-9 pr-10 py-2.5 border rounded-lg text-xs font-semibold focus:ring-2 focus:ring-blue-500 focus:outline-none"
              [ngClass]="loginForm.get('clave')?.invalid && loginForm.get('clave')?.touched ? 'border-rose-400 bg-rose-50' : 'border-slate-300'"
            />
            <button
              type="button"
              (click)="togglePassword()"
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 cursor-pointer"
            >
              @if (showPassword()) {
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" /></svg>
              } @else {
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
              }
            </button>
          </div>
        </div>

        <!-- Botón Ingresar -->
        <button
          type="submit"
          [disabled]="isLoading()"
          class="w-full py-3 bg-[#1b53ad] hover:bg-blue-800 disabled:opacity-50 text-white rounded-lg font-bold shadow-md hover:shadow-lg transition flex items-center justify-center gap-2 cursor-pointer mt-2"
        >
          @if (isLoading()) {
            <span class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
            <span>Verificando credenciales...</span>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
            </svg>
            <span>Ingresar al Sistema</span>
          }
        </button>

      </form>

      <!-- Enlace a Portal General -->
      <div class="text-center pt-2 border-t border-slate-100">
        <a routerLink="/" class="text-xs text-blue-700 hover:text-blue-900 font-semibold hover:underline">
          ← Volver al Portal de Trámites Departamentales
        </a>
      </div>

    </div>

    <!-- Footer -->
    <div class="bg-slate-100 px-6 py-3 text-center border-t border-slate-200 text-[11px] text-slate-500">
      Gobernación del Cauca — Subdirección de Rentas y Fiscalización © 2026
    </div>

  </div>

</div>
