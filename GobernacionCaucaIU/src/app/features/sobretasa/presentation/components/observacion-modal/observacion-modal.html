<div class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-900/70 backdrop-blur-xs overflow-y-auto">
  <div class="relative bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-lg overflow-hidden animate-in fade-in zoom-in duration-200">
    
    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200 bg-rose-50 text-rose-900">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-rose-100 text-rose-700 flex items-center justify-center text-xl font-bold">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <div>
          <h3 class="text-sm font-bold">Requerimiento de Fiscalización</h3>
          <p class="text-[11px] text-rose-700">Declaración: {{ declaracion.numeroRadicado }}</p>
        </div>
      </div>
      <button
        type="button"
        (click)="cerrar.emit()"
        class="text-rose-400 hover:text-rose-700 cursor-pointer"
      >
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>

    <!-- Body -->
    <div class="p-6 space-y-4 text-xs">
      <div>
        <label class="block font-semibold text-slate-700 mb-1">Causal Principal de Discrepancia</label>
        <select
          [(ngModel)]="motivoSeleccionado"
          class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white font-medium text-slate-800 focus:border-rose-500 focus:outline-hidden"
        >
          <option *ngFor="let c of causalesPredefinidas" [value]="c">{{ c }}</option>
        </select>
      </div>

      <div>
        <label class="block font-semibold text-slate-700 mb-1">Detalle del Requerimiento / Instrucciones al Mayorista</label>
        <textarea
          [(ngModel)]="observacionDetallada"
          rows="4"
          placeholder="Especifique las guías puntuales, galones faltantes o soporte documental requerido..."
          class="w-full px-3 py-2 rounded-lg border border-slate-300 font-medium text-slate-800 focus:border-rose-500 focus:outline-hidden resize-none"
        ></textarea>
      </div>

      <div class="p-3 bg-amber-50 rounded-lg border border-amber-200 text-amber-800 text-[11px]">
        <strong>Efecto del Requerimiento:</strong> La declaración pasará a estado <code>OBSERVADO</code>. El agente mayorista recibirá notificación y podrá subsanar y cargar los ajustes requeridos antes de liquidar nuevamente.
      </div>
    </div>

    <!-- Footer -->
    <div class="flex items-center justify-between px-6 py-3 border-t border-slate-200 bg-slate-50">
      <button
        type="button"
        (click)="cerrar.emit()"
        class="px-4 py-2 rounded-lg text-xs font-bold text-slate-600 hover:bg-slate-200 transition-colors cursor-pointer"
      >
        Cancelar
      </button>
      <button
        type="button"
        (click)="guardarObservacion()"
        class="inline-flex items-center gap-2 px-5 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold shadow-xs transition-colors cursor-pointer"
      >
        <i class="fa-solid fa-paper-plane"></i>
        <span>Emitir Requerimiento (Observar)</span>
      </button>
    </div>

  </div>
</div>
