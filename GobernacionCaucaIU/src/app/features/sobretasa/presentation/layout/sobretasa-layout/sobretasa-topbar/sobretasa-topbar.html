<header class="h-16 bg-[#0f4984] text-white flex items-center justify-between px-4 z-20 border-b border-slate-700/60 shadow-sm shrink-0 w-full relative">
  <!-- Left Side: Toggle button, Logo, Title & Breadcrumbs -->
  <div class="flex items-center space-x-3">
    <!-- Sidebar Toggle Button -->
    <button 
      (click)="toggleSidebar.emit()"
      type="button"
      class="p-2 rounded-lg bg-slate-800/40 text-slate-200 hover:text-white hover:bg-slate-800/80 focus:outline-none transition cursor-pointer"
      title="Alternar Menú"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
      </svg>
    </button>

    <!-- Brand Logo & Title -->
    <a routerLink="/" class="flex items-center space-x-2.5 cursor-pointer group" title="Ir al Inicio">
      <div class="h-9 px-2 py-0.5 bg-white rounded-lg flex items-center justify-center shadow-xs">
        <img src="/Logo_gov_cauca.png" alt="Gobernación del Cauca" class="h-7 w-auto object-contain" />
      </div>
      <div class="flex flex-col">
        <span class="text-xs font-bold tracking-widest text-white uppercase leading-none">Sobretasa Combustibles</span>
      </div>
    </a>

    <!-- Dynamic Breadcrumbs in Header -->
    <div class="hidden lg:flex items-center pl-4 ml-4 border-l border-white/20">
      <app-breadcrumb theme="dark" />
    </div>
  </div>

  <!-- Right Section: Switch Portal Mayorista / Ciudadano, Notifications & User Profile -->
  <div class="flex items-center space-x-3">
    
    <!-- Link Switch to Portal Agente Mayorista -->
    <a
      routerLink="/sobretasa/portal-ciudadano"
      class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-400 hover:bg-amber-300 text-slate-950 shadow-xs transition-colors cursor-pointer"
      title="Ir a la vista del Agente Mayorista / Contribuyente"
    >
      <i class="fa-solid fa-gas-pump text-xs"></i>
      <span>Portal Mayorista</span>
    </a>

    <!-- Notification Icon with Pending Validations badge -->
    <button type="button" class="relative p-2 text-slate-300 hover:text-white hover:bg-slate-800/50 rounded-lg transition cursor-pointer" title="Declaraciones Pendientes de Revisión">
      <i class="fa-solid fa-bell text-base"></i>
      @if (sobretasaService.kpis().declaracionesPendientesRevision > 0) {
        <span class="absolute top-1 right-1 flex h-4 w-4 items-center justify-center rounded-full bg-rose-500 text-[10px] font-bold text-white">
          {{ sobretasaService.kpis().declaracionesPendientesRevision }}
        </span>
      }
    </button>

    <!-- User Profile Dropdown -->
    <div class="relative">
      <button
        (click)="toggleProfileMenu()"
        type="button"
        class="flex items-center space-x-2.5 p-1.5 rounded-lg hover:bg-slate-800/50 transition focus:outline-none cursor-pointer text-left"
      >
        <div class="w-8 h-8 rounded-full bg-blue-700 text-white font-bold text-xs flex items-center justify-center shadow-xs">
          {{ userInitials() }}
        </div>
        <div class="hidden sm:flex flex-col text-left">
          <span class="text-xs font-semibold text-white leading-tight">
            {{ userName() }}
          </span>
          <span class="text-[10px] text-slate-300 leading-none mt-0.5">{{ userRole() }}</span>
        </div>
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-3.5 h-3.5 text-slate-300">
          <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
        </svg>
      </button>

      <!-- Dropdown Menu -->
      @if (isProfileMenuOpen()) {
        <div class="absolute right-0 mt-2 w-56 bg-[#1e293b] rounded-lg shadow-xl py-1 border border-slate-700 z-30 text-xs animate-in fade-in">
          <div class="px-4 py-2.5 border-b border-slate-700 flex flex-col gap-0.5">
            <span class="font-bold text-white leading-tight">{{ userName() }}</span>
            <span class="text-[10px] text-slate-400 truncate">{{ currentUser()?.email || 'fiscalizacion.gasolina@cauca.gov.co' }}</span>
          </div>
          
          <a routerLink="/" (click)="isProfileMenuOpen.set(false)" class="block px-4 py-2 text-slate-200 hover:bg-slate-700 font-medium">
            <i class="fa-solid fa-house text-slate-400 mr-2"></i>Portal Principal Rentas
          </a>
          
          <a routerLink="/sobretasa/configuracion" (click)="isProfileMenuOpen.set(false)" class="block px-4 py-2 text-slate-200 hover:bg-slate-700 font-medium">
            <i class="fa-solid fa-gear text-slate-400 mr-2"></i>Catálogos EDS & Mayoristas
          </a>

          <div class="border-t border-slate-700 my-1"></div>

          <button
            (click)="logout(); isProfileMenuOpen.set(false)"
            type="button"
            class="w-full text-left block px-4 py-2 text-rose-400 hover:bg-slate-700 font-medium cursor-pointer"
          >
            <i class="fa-solid fa-right-from-bracket text-rose-400 mr-2"></i>Cerrar Sesión
          </button>
        </div>
      }
    </div>
  </div>
</header>
