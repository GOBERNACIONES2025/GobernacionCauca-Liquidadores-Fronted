<div [formGroup]="formulario()">
  <div class="mb-8 text-center">
    <h2 class="text-xl font-bold text-[#1b53ad] sm:text-2xl">2. Información de contacto</h2>
    <p class="mx-auto mt-2 max-w-3xl text-sm leading-relaxed text-slate-500">Diligencie correctamente el correo electrónico donde desea recibir la notificación. No incluya espacios en blanco.</p>
  </div>

  <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
    <label class="flex flex-col gap-1.5"><span class="text-xs font-semibold text-slate-700"><span class="text-red-500">*</span> Teléfono celular</span><input type="tel" inputmode="numeric" maxlength="10" formControlName="telefono" (input)="sanitizarTelefono('telefono')" (copy)="$event.preventDefault()" (paste)="$event.preventDefault()" (cut)="$event.preventDefault()" class="rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-[#1b53ad] focus:ring-2 focus:ring-blue-100" />@if (formulario().controls['telefono'].value && formulario().controls['telefono'].invalid) { <span class="text-xs text-red-600">El teléfono debe tener 10 dígitos.</span> }</label>
    <label class="flex flex-col gap-1.5"><span class="text-xs font-semibold text-slate-700"><span class="text-red-500">*</span> Confirmar teléfono celular</span><input type="tel" inputmode="numeric" maxlength="10" formControlName="confirmarTelefono" (input)="sanitizarTelefono('confirmarTelefono')" (copy)="$event.preventDefault()" (paste)="$event.preventDefault()" (cut)="$event.preventDefault()" class="rounded-lg border bg-slate-50 px-3 py-2.5 text-sm outline-none" [class.border-green-500]="coinciden('telefono', 'confirmarTelefono')" [class.border-red-400]="formulario().controls['confirmarTelefono'].value && !coinciden('telefono', 'confirmarTelefono')" [class.border-slate-300]="!formulario().controls['confirmarTelefono'].value" />@if (formulario().controls['confirmarTelefono'].value && !coinciden('telefono', 'confirmarTelefono')) { <span class="text-xs text-red-600">Los teléfonos no coinciden.</span> }</label>
    <label class="flex flex-col gap-1.5"><span class="text-xs font-semibold text-slate-700"><span class="text-red-500">*</span> Correo electrónico</span><input type="email" formControlName="correo" (copy)="$event.preventDefault()" (paste)="$event.preventDefault()" (cut)="$event.preventDefault()" class="rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-[#1b53ad] focus:ring-2 focus:ring-blue-100" />@if (formulario().controls['correo'].value && formulario().controls['correo'].invalid) { <span class="text-xs text-red-600">El formato del correo no es válido.</span> }</label>
    <label class="flex flex-col gap-1.5"><span class="text-xs font-semibold text-slate-700"><span class="text-red-500">*</span> Confirmar correo electrónico</span><input type="email" formControlName="confirmarCorreo" (copy)="$event.preventDefault()" (paste)="$event.preventDefault()" (cut)="$event.preventDefault()" class="rounded-lg border bg-slate-50 px-3 py-2.5 text-sm outline-none" [class.border-green-500]="coinciden('correo', 'confirmarCorreo')" [class.border-red-400]="formulario().controls['confirmarCorreo'].value && !coinciden('correo', 'confirmarCorreo')" [class.border-slate-300]="!formulario().controls['confirmarCorreo'].value" />@if (formulario().controls['confirmarCorreo'].value && !coinciden('correo', 'confirmarCorreo')) { <span class="text-xs text-red-600">Los correos no coinciden.</span> }</label>
    <label class="flex flex-col gap-1.5"><span class="text-xs font-semibold text-slate-700"><span class="text-red-500">*</span> Departamento</span><select formControlName="departamento" (change)="actualizarDepartamento()" class="rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-[#1b53ad] focus:ring-2 focus:ring-blue-100"><option value="">Seleccione un departamento</option>@for (item of departamentos; track item.departamento) { <option [value]="item.departamento">{{ item.departamento }}</option> }</select></label>
    <label class="flex flex-col gap-1.5"><span class="text-xs font-semibold text-slate-700"><span class="text-red-500">*</span> Municipio</span><select formControlName="municipio" [attr.disabled]="!formulario().controls['departamento'].value ? true : null" class="rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-[#1b53ad] focus:ring-2 focus:ring-blue-100 disabled:cursor-not-allowed disabled:opacity-60"><option value="">Seleccione un municipio</option>@for (municipio of municipios(); track municipio) { <option [value]="municipio">{{ municipio }}</option> }</select></label>
  </div>

  @if (completado()) {
    <div class="mt-6 rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800"><i class="fa-solid fa-circle-check mr-2" aria-hidden="true"></i>Los datos personales y de contacto están completos. La siguiente etapa se habilitará posteriormente.</div>
  }

  <div class="mt-8 flex flex-col-reverse justify-end gap-3 sm:flex-row">
    <button type="button" (click)="anterior.emit()" class="rounded-lg border border-slate-300 bg-white px-6 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-50">Anterior</button>
    <button type="button" (click)="continuar.emit()" [disabled]="formulario().invalid || completado()" class="rounded-lg bg-[#1b53ad] px-6 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-800 disabled:cursor-not-allowed disabled:opacity-50">Continuar</button>
  </div>
</div>
