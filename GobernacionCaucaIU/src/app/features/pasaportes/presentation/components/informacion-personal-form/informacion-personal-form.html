<div [formGroup]="formulario()">
  <div class="mb-8 text-center">
    <h2 class="text-xl font-bold text-[#1b53ad] sm:text-2xl">1. Información personal</h2>
    <p class="mt-2 text-sm text-slate-500">Por favor ingrese los datos solicitados.</p>
  </div>

  <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
    <label class="flex flex-col gap-1.5 md:col-span-2">
      <span class="text-xs font-semibold text-slate-700"><span class="text-red-500">*</span> Primer nombre</span>
      <input formControlName="primerNombre" (input)="sanitizarNombre('primerNombre')" class="rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-[#1b53ad] focus:ring-2 focus:ring-blue-100" />
    </label>
    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-slate-700">Segundo nombre</span>
      <input formControlName="segundoNombre" (input)="sanitizarNombre('segundoNombre')" class="rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-[#1b53ad] focus:ring-2 focus:ring-blue-100" />
    </label>
    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-slate-700"><span class="text-red-500">*</span> Primer apellido</span>
      <input formControlName="primerApellido" (input)="sanitizarNombre('primerApellido')" class="rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-[#1b53ad] focus:ring-2 focus:ring-blue-100" />
    </label>
    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-slate-700">Segundo apellido</span>
      <input formControlName="segundoApellido" (input)="sanitizarNombre('segundoApellido')" class="rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-[#1b53ad] focus:ring-2 focus:ring-blue-100" />
    </label>
    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-slate-700"><span class="text-red-500">*</span> Tipo de documento</span>
      <select formControlName="tipoDocumento" class="rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-[#1b53ad] focus:ring-2 focus:ring-blue-100">
        <option value="">Seleccione un tipo</option>
        @for (tipo of tiposDocumento; track tipo.id) { <option [value]="tipo.id">{{ tipo.nombre }}</option> }
      </select>
    </label>
    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-slate-700"><span class="text-red-500">*</span> Número de documento</span>
      <input formControlName="numeroDocumento" inputmode="numeric" (input)="sanitizarNumero('numeroDocumento')" (copy)="$event.preventDefault()" (paste)="$event.preventDefault()" (cut)="$event.preventDefault()" class="rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-[#1b53ad] focus:ring-2 focus:ring-blue-100" />
    </label>
    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-slate-700"><span class="text-red-500">*</span> Confirmar número de documento</span>
      <input formControlName="confirmarDocumento" inputmode="numeric" (input)="sanitizarNumero('confirmarDocumento')" (copy)="$event.preventDefault()" (paste)="$event.preventDefault()" (cut)="$event.preventDefault()" class="rounded-lg border bg-slate-50 px-3 py-2.5 text-sm outline-none focus:ring-2" [class.border-red-400]="formulario().controls['confirmarDocumento'].value && !documentosCoinciden()" [class.border-green-500]="formulario().controls['confirmarDocumento'].value && documentosCoinciden()" [class.border-slate-300]="!formulario().controls['confirmarDocumento'].value" />
      @if (formulario().controls['confirmarDocumento'].value) {
        <span class="text-xs" [class.text-green-600]="documentosCoinciden()" [class.text-red-600]="!documentosCoinciden()">{{ documentosCoinciden() ? 'Los números de documento coinciden.' : 'Los números de documento no coinciden.' }}</span>
      }
    </label>
    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-slate-700"><span class="text-red-500">*</span> Sexo</span>
      <select formControlName="genero" class="rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-[#1b53ad] focus:ring-2 focus:ring-blue-100"><option value="">Seleccione su sexo</option>@for (opcion of generos; track opcion) { <option [value]="opcion">{{ opcion }}</option> }</select>
    </label>
    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-slate-700"><span class="text-red-500">*</span> Grupo étnico</span>
      <select formControlName="grupoEtnico" class="rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-[#1b53ad] focus:ring-2 focus:ring-blue-100"><option value="">Seleccione un grupo étnico</option>@for (opcion of gruposEtnicos; track opcion) { <option [value]="opcion">{{ opcion }}</option> }</select>
    </label>
    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-slate-700"><span class="text-red-500">*</span> Discapacidad</span>
      <select formControlName="discapacidad" class="rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-[#1b53ad] focus:ring-2 focus:ring-blue-100"><option value="">Seleccione una discapacidad</option>@for (opcion of discapacidades; track opcion) { <option [value]="opcion">{{ opcion }}</option> }</select>
    </label>
    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-slate-700"><span class="text-red-500">*</span> Fecha de nacimiento</span>
      <input type="date" formControlName="fechaNacimiento" class="rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-[#1b53ad] focus:ring-2 focus:ring-blue-100" />
    </label>

    @if (esMenorDeEdad()) {
      <div class="grid grid-cols-1 gap-5 rounded-lg border border-amber-200 bg-amber-50 p-4 md:col-span-2 md:grid-cols-2">
        <label class="flex flex-col gap-1.5 md:col-span-2"><span class="text-xs font-semibold text-slate-700"><span class="text-red-500">*</span> Nombre del adulto responsable</span><input formControlName="nombreResponsable" placeholder="Nombre completo del responsable" class="rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm outline-none focus:border-[#1b53ad]" /></label>
        <label class="flex flex-col gap-1.5"><span class="text-xs font-semibold text-slate-700"><span class="text-red-500">*</span> Documento del adulto responsable</span><input formControlName="documentoResponsable" (copy)="$event.preventDefault()" (paste)="$event.preventDefault()" (cut)="$event.preventDefault()" class="rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm outline-none focus:border-[#1b53ad]" /></label>
        <label class="flex flex-col gap-1.5"><span class="text-xs font-semibold text-slate-700"><span class="text-red-500">*</span> Confirmar documento</span><input formControlName="confirmarDocumentoResponsable" (copy)="$event.preventDefault()" (paste)="$event.preventDefault()" (cut)="$event.preventDefault()" class="rounded-lg border bg-white px-3 py-2.5 text-sm outline-none" [class.border-red-400]="formulario().controls['confirmarDocumentoResponsable'].value && !responsableCoincide()" [class.border-green-500]="formulario().controls['confirmarDocumentoResponsable'].value && responsableCoincide()" [class.border-slate-300]="!formulario().controls['confirmarDocumentoResponsable'].value" /></label>
      </div>
    }

    <label class="flex items-start gap-3 rounded-lg border border-blue-100 bg-blue-50 p-4 md:col-span-2">
      <input type="checkbox" formControlName="aceptoLey" class="mt-0.5 h-4 w-4 accent-[#1b53ad]" />
      <span class="text-xs leading-relaxed text-slate-700"><span class="font-semibold">Advertencia:</span> La información relacionada en el formulario será utilizada por la entidad, amparada en la Ley Estatutaria 1581 de 2012, Habeas Data, para el manejo y gestión de bases de datos.</span>
    </label>
  </div>

  <div class="mt-8 flex justify-end">
    <button type="button" (click)="continuar.emit()" [disabled]="!puedeContinuar()" class="rounded-lg bg-[#1b53ad] px-6 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-800 disabled:cursor-not-allowed disabled:opacity-50">Siguiente</button>
  </div>
</div>
