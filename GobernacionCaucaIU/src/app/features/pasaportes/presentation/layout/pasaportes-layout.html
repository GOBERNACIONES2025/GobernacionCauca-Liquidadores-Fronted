<div class="flex min-h-screen flex-col bg-[#F8FAFC] text-slate-800 font-sans">
  <header
    class="sticky top-0 z-30 border-b border-blue-900/60 bg-[#1b53ad] text-white shadow-sm"
  >
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <div class="flex h-16 items-center justify-between gap-4">

        <!-- Identidad institucional -->
        <div class="flex min-w-0 items-center space-x-2.5">
          <div
            class="flex h-9 shrink-0 items-center justify-center rounded-lg bg-white px-2 py-0.5 shadow-xs"
          >
            <img
              src="/Logo_gov_cauca.png"
              alt="Gobernación del Cauca"
              class="h-7 w-auto object-contain"
            />
          </div>

          <div class="flex min-w-0 flex-col">
            <span
              class="truncate text-xs font-bold uppercase leading-none tracking-widest text-blue-300"
            >
              Pasaportes
            </span>

            <span
              class="mt-1 truncate text-[10px] font-medium leading-none text-blue-200"
            >
              Portal Departamental
            </span>
          </div>
        </div>

        <!-- Acciones exclusivamente administrativas -->
        @if (isAdminDashboard) {
          <div class="flex shrink-0 items-center gap-2">
            <button
              type="button"
              (click)="logout('liquidadores')"
              class="inline-flex items-center gap-1.5 rounded-lg border border-blue-300/40 bg-white/10 px-3 py-1.5 text-xs font-semibold text-white transition hover:bg-white/20 sm:px-3.5"
            >
              <i
                class="fa-solid fa-arrow-left text-xs"
                aria-hidden="true"
              ></i>

              <span class="hidden sm:inline">
                Volver a Liquidadores
              </span>

              <span class="sm:hidden">
                Volver
              </span>
            </button>

            <button
              type="button"
              (click)="logout('login')"
              class="inline-flex items-center gap-1.5 rounded-lg border border-blue-400/30 bg-[#123f86] px-3 py-1.5 text-xs font-semibold text-white transition hover:bg-blue-950 sm:px-3.5"
            >
              <i
                class="fa-solid fa-right-from-bracket text-xs"
                aria-hidden="true"
              ></i>

              <span class="hidden sm:inline">
                Cerrar sesión
              </span>

              <span class="sm:hidden">
                Salir
              </span>
            </button>
          </div>
        }

      </div>
    </div>
  </header>

  <main class="flex-1">
    <router-outlet />
  </main>
</div>
