<div class="flex min-h-screen flex-col bg-[#F8FAFC] text-slate-800 font-sans">
  <header class="sticky top-0 z-30 border-b border-blue-900/60 bg-[#1b53ad] text-white shadow-sm">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <div class="flex h-16 items-center justify-between gap-4">
        <a routerLink="/" class="flex min-w-0 items-center space-x-2.5 cursor-pointer group" title="Ir al Inicio">
          <div class="h-9 px-2 py-0.5 bg-white rounded-lg flex items-center justify-center shadow-xs shrink-0">
            <img src="/Logo_gov_cauca.png" alt="Gobernación del Cauca" class="h-7 w-auto object-contain" />
          </div>
          <div class="flex min-w-0 flex-col">
            <span class="truncate text-xs font-bold tracking-widest text-blue-300 uppercase leading-none">Pasaportes</span>
            <span class="truncate text-[10px] font-medium leading-none text-blue-200 mt-1">Portal Departamental</span>
          </div>
        </a>

        <div class="flex shrink-0 items-center gap-2">
          @if (isAdminDashboard) {
            <button
              type="button"
              (click)="logout('liquidadores')"
              class="inline-flex items-center gap-1.5 rounded-lg border border-blue-300/40 bg-white/10 px-3 py-1.5 text-xs font-semibold text-white transition hover:bg-white/20 sm:px-3.5"
            >
              <i class="fa-solid fa-arrow-left text-xs" aria-hidden="true"></i>
              <span class="hidden sm:inline">Volver a Liquidadores</span>
              <span class="sm:hidden">Volver</span>
            </button>
            <button
              type="button"
              (click)="logout('login')"
              class="inline-flex items-center gap-1.5 rounded-lg border border-blue-400/30 bg-[#123f86] px-3 py-1.5 text-xs font-semibold text-white transition hover:bg-blue-950 sm:px-3.5"
            >
              <i class="fa-solid fa-right-from-bracket text-xs" aria-hidden="true"></i>
              <span class="hidden sm:inline">Cerrar sesión</span>
              <span class="sm:hidden">Salir</span>
            </button>
          } @else {
            <a
              routerLink="/"
              class="inline-flex items-center gap-1.5 rounded-lg border border-blue-400/30 bg-[#123f86] px-3 py-1.5 text-xs font-semibold text-white transition hover:bg-blue-950 sm:px-3.5"
            >
              <i class="fa-solid fa-arrow-left text-xs" aria-hidden="true"></i>
              <span class="hidden sm:inline">Volver a Liquidadores</span>
              <span class="sm:hidden">Volver</span>
            </a>
          }
        </div>
      </div>
    </div>
  </header>

  <main class="flex-1">
    <router-outlet />
  </main>
</div>
