<header class="h-16 bg-[#1b53ad] text-white flex items-center justify-between px-4 z-20 border-b border-blue-900/40 shadow-sm shrink-0 w-full relative">
  
  <!-- Left Side: Toggle button, Logo & Title -->
  <div class="flex items-center space-x-3">
    <!-- Sidebar Toggle Button -->
    <button 
      (click)="toggleSidebar.emit()"
      type="button"
      class="p-2 rounded-lg bg-blue-950/40 text-blue-100 hover:text-white hover:bg-blue-950/70 focus:outline-none transition cursor-pointer"
      title="Alternar Menú Lateral">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
      </svg>
    </button>

    <!-- Brand Logo & Title -->
    <a routerLink="/" class="flex items-center space-x-2.5 cursor-pointer group" title="Ir al Portal Principal">
      <div class="h-9 px-2 py-0.5 bg-white rounded-lg flex items-center justify-center shadow-xs">
        <img src="/Logo_gov_cauca.png" alt="Gobernación del Cauca" class="h-7 w-auto object-contain" />
      </div>
      <div class="flex flex-col">
        <span class="text-xs font-bold tracking-widest text-blue-200 uppercase leading-none">Degüello de Ganado</span>
        <span class="text-[11px] text-blue-100/80 font-medium">Secretaría de Hacienda</span>
      </div>
    </a>

    <!-- Badge Normativo Oficial -->
    <div class="hidden lg:flex items-center pl-4 ml-3 border-l border-white/20">
      <span class="text-xs font-medium text-blue-100 bg-blue-900/50 px-2.5 py-1 rounded-full border border-blue-400/30 flex items-center space-x-1.5">
        <i class="fa-solid fa-scale-balanced text-amber-300"></i>
        <span>Renta Departamental — Ley 8 de 1909</span>
      </span>
    </div>
  </div>

  <!-- Right Section: Shortcuts & User Profile -->
  <div class="flex items-center space-x-3">
    
    <a routerLink="/" class="hidden sm:inline-flex items-center px-3 py-1.5 text-xs font-semibold rounded-lg bg-white/10 hover:bg-white/20 text-white transition cursor-pointer">
      <i class="fa-solid fa-house mr-1.5"></i>
      Inicio
    </a>

    <!-- Notification Icon -->
    <div class="relative">
      <button type="button" class="relative p-2 text-blue-100 hover:text-white hover:bg-blue-900/40 rounded-lg transition" title="Notificaciones">
        <i class="fa-solid fa-bell text-base"></i>
        <span class="absolute top-1 right-1 flex h-4 w-4 items-center justify-center rounded-full bg-emerald-500 text-[10px] font-bold text-white">1</span>
      </button>
    </div>

    <!-- User Profile Dropdown -->
    <div class="relative">
      <button
        (click)="toggleProfileMenu()"
        type="button"
        class="flex items-center space-x-2.5 p-1.5 rounded-lg hover:bg-blue-900/40 transition focus:outline-none cursor-pointer text-left">
        <div class="w-8 h-8 rounded-full bg-emerald-600 text-white font-bold text-xs flex items-center justify-center shadow-sm">
          FD
        </div>
        <div class="hidden sm:flex flex-col text-left">
          <span class="text-xs font-semibold text-white leading-tight">Funcionario Rentas</span>
          <span class="text-[10px] text-blue-200 leading-none mt-0.5">Degüello Mayor</span>
        </div>
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-3.5 h-3.5 text-blue-200">
          <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
        </svg>
      </button>

      <!-- Dropdown Menu -->
      <div *ngIf="isProfileMenuOpen()" class="absolute right-0 mt-2 w-52 bg-[#1e293b] rounded-lg shadow-xl py-1 border border-slate-700 z-30 text-xs">
        <div class="px-4 py-2.5 border-b border-slate-700 flex flex-col gap-0.5">
          <span class="font-bold text-white leading-tight">Secretaría de Hacienda</span>
          <span class="text-[10px] text-slate-400">Grupo de Rentas y Fiscalización</span>
        </div>
        
        <a routerLink="/deguello/dashboard" (click)="isProfileMenuOpen.set(false)" class="block px-4 py-2 text-slate-200 hover:bg-slate-700 font-medium">
          <i class="fa-solid fa-gauge-high text-indigo-400 mr-2"></i>Dashboard
        </a>

        <a routerLink="/deguello/liquidacion" (click)="isProfileMenuOpen.set(false)" class="block px-4 py-2 text-slate-200 hover:bg-slate-700 font-medium">
          <i class="fa-solid fa-calculator text-blue-400 mr-2"></i>Liquidación
        </a>

        <a routerLink="/deguello/facturacion" (click)="isProfileMenuOpen.set(false)" class="block px-4 py-2 text-slate-200 hover:bg-slate-700 font-medium">
          <i class="fa-solid fa-file-invoice text-emerald-400 mr-2"></i>Facturación Oficial
        </a>

        <a routerLink="/deguello/informes" (click)="isProfileMenuOpen.set(false)" class="block px-4 py-2 text-slate-200 hover:bg-slate-700 font-medium">
          <i class="fa-solid fa-chart-pie text-cyan-400 mr-2"></i>Informes & 10% Municipios
        </a>
        
        <a routerLink="/deguello/parametrizacion" (click)="isProfileMenuOpen.set(false)" class="block px-4 py-2 text-slate-200 hover:bg-slate-700 font-medium">
          <i class="fa-solid fa-sliders text-amber-400 mr-2"></i>Parametrización
        </a>

        <div class="border-t border-slate-700 my-1"></div>

        <button
          (click)="logout(); isProfileMenuOpen.set(false)"
          type="button"
          class="w-full text-left block px-4 py-2 text-rose-400 hover:bg-slate-700 font-medium cursor-pointer">
          <i class="fa-solid fa-right-from-bracket text-rose-400 mr-2"></i>Cerrar Sesión
        </button>
      </div>
    </div>

  </div>

</header>
