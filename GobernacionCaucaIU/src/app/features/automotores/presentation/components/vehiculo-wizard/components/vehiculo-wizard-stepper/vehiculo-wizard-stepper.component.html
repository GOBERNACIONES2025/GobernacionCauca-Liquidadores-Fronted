<div class="px-6 sm:px-10 py-3 shrink-0">
  <div class="flex items-center justify-between relative max-w-[480px] mx-auto">
    
    <!-- STEP 01: DATOS DEL VEHÍCULO -->
    <div class="flex flex-col items-center relative z-10">
      <span class="text-[12px] font-bold text-slate-800 mb-1">01</span>
      <div class="w-7 h-7 rounded-full flex items-center justify-center transition-all shadow-2xs"
           [ngClass]="currentStep >= 1 ? 'bg-[#1b53ad] text-white' : 'border-2 border-slate-300 bg-white text-slate-400'">
        <i class="fa-solid fa-check text-[11px]"></i>
      </div>
      <span class="text-[10.5px] mt-1.5 whitespace-nowrap text-center leading-tight"
            [ngClass]="currentStep === 1 ? 'font-bold text-[#1b53ad]' : 'text-slate-500'">
        Datos del vehículo
      </span>
    </div>

    <!-- LÍNEA 1-2 -->
    <div class="h-[2px] flex-1 mx-2 -mt-5 transition-colors"
         [ngClass]="currentStep >= 2 ? 'bg-[#1b53ad]' : 'bg-slate-200'"></div>

    <!-- STEP 02: PROPIETARIO -->
    <div class="flex flex-col items-center relative z-10">
      <span class="text-[12px] font-bold text-slate-800 mb-1">02</span>
      <div class="w-7 h-7 rounded-full flex items-center justify-center transition-all shadow-2xs"
           [ngClass]="currentStep >= 2 ? 'bg-[#1b53ad] text-white' : 'border-2 border-slate-300 bg-white text-transparent'">
        @if (currentStep >= 2) {
          <i class="fa-solid fa-check text-[11px]"></i>
        }
      </div>
      <span class="text-[10.5px] mt-1.5 whitespace-nowrap text-center leading-tight"
            [ngClass]="currentStep === 2 ? 'font-bold text-[#1b53ad]' : 'text-slate-500'">
        Propietario
      </span>
    </div>

    <!-- LÍNEA 2-3 -->
    <div class="h-[2px] flex-1 mx-2 -mt-5 transition-colors"
         [ngClass]="currentStep >= 3 ? 'bg-[#1b53ad]' : 'bg-slate-200'"></div>

    <!-- STEP 03: HISTORIAL -->
    <div class="flex flex-col items-center relative z-10">
      <span class="text-[12px] font-bold text-slate-800 mb-1">03</span>
      <div class="w-7 h-7 rounded-full flex items-center justify-center transition-all shadow-2xs"
           [ngClass]="currentStep >= 3 ? 'bg-[#1b53ad] text-white' : 'border-2 border-slate-300 bg-white text-transparent'">
        @if (currentStep >= 3) {
          <i class="fa-solid fa-check text-[11px]"></i>
        }
      </div>
      <span class="text-[10.5px] mt-1.5 whitespace-nowrap text-center leading-tight"
            [ngClass]="currentStep === 3 ? 'font-bold text-[#1b53ad]' : 'text-slate-500'">
        Historial
      </span>
    </div>

    <!-- LÍNEA 3-4 -->
    <div class="h-[2px] flex-1 mx-2 -mt-5 transition-colors"
         [ngClass]="currentStep >= 4 ? 'bg-[#1b53ad]' : 'bg-slate-200'"></div>

    <!-- STEP 04: OBSERVACIONES -->
    <div class="flex flex-col items-center relative z-10">
      <span class="text-[12px] font-bold text-slate-800 mb-1">04</span>
      <div class="w-7 h-7 rounded-full flex items-center justify-center transition-all shadow-2xs"
           [ngClass]="currentStep >= 4 ? 'bg-[#1b53ad] text-white' : 'border-2 border-slate-300 bg-white text-transparent'">
        @if (currentStep >= 4) {
          <i class="fa-solid fa-check text-[11px]"></i>
        }
      </div>
      <span class="text-[10.5px] mt-1.5 whitespace-nowrap text-center leading-tight"
            [ngClass]="currentStep === 4 ? 'font-bold text-[#1b53ad]' : 'text-slate-500'">
        Observaciones
      </span>
    </div>

  </div>
</div>
