<div class="fade-in fixed inset-0 z-[350] bg-slate-900/50 backdrop-blur-[1.5px] flex items-center justify-center p-4" (click)="cerrar.emit()">
  <div (click)="$event.stopPropagation()" class="bg-white rounded-xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-100 relative z-10 animate-in zoom-in-95 duration-150">
    
    <!-- Modal Header -->
    <div class="p-4 border-b border-slate-100 flex items-start justify-between bg-white">
      <div>
        <h3 class="text-base font-bold text-slate-900 m-0">Consultar RUNT</h3>
        <p class="text-xs text-slate-400 mt-0.5 mb-0">Registro Único Nacional de Tránsito — Consulta en tiempo real</p>
      </div>
      <button (click)="cerrar.emit()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg hover:bg-slate-100 transition-colors cursor-pointer border-none bg-transparent">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Modal Body -->
    <div class="p-4 space-y-4 bg-white">
      <div class="bg-blue-50/70 border-l-4 border-[#1e3a7b] p-3 rounded-r-xl text-xs text-blue-950 flex items-start gap-2.5">
        <svg class="w-4 h-4 text-[#1e3a7b] shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span class="leading-relaxed">Los datos del RUNT son de solo lectura. Si existen diferencias con el expediente local, se habilitará la opción de actualización.</span>
      </div>

      <div>
        <label class="text-xs font-bold text-slate-700 tracking-wider uppercase block mb-1">
          PLACA A CONSULTAR <span class="text-red-500">*</span>
        </label>
        <div class="flex items-center gap-2">
          <input
            type="text"
            [ngModel]="facade.operaciones.placaRunt()"
            (ngModelChange)="facade.operaciones.placaRunt.set($event)"
            placeholder="Ej: ABC123"
            class="border border-slate-200 rounded-lg px-3 py-2 text-xs md:text-sm font-mono font-bold text-slate-800 uppercase tracking-wider flex-1 focus:outline-none focus:border-[#1e3a7b] bg-white"/>
          
          <button 
            type="button"
            (click)="consultar.emit()"
            [disabled]="facade.operaciones.runtLoading()"
            class="bg-[#1e3a7b] hover:bg-[#162c5b] text-white font-semibold px-4 py-2 rounded-lg text-xs flex items-center gap-2 transition-colors shadow-sm cursor-pointer whitespace-nowrap border-none disabled:opacity-50">
            @if (facade.operaciones.runtLoading()) {
              <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Consultando...
            } @else {
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
              </svg>
              Consultar RUNT
            }
          </button>
        </div>
      </div>
    </div>

    <div class="p-3 bg-slate-50 border-t border-slate-100 flex justify-end">
      <button (click)="cerrar.emit()" class="border border-slate-300 text-slate-700 bg-white hover:bg-slate-50 px-4 py-1.5 rounded-lg text-xs font-semibold transition-colors cursor-pointer">
        Cerrar
      </button>
    </div>
  </div>
</div>
