<div class="flex h-full w-full relative overflow-hidden bg-slate-50">
  
  <!-- Mobile Toggle Button (Visible on screens < lg) -->
  <div class="lg:hidden fixed bottom-4 left-4 z-40">
    <button 
      (click)="toggleMobileSidebar()" 
      class="btn btn-circle bg-blue-800 hover:bg-blue-900 shadow-lg flex items-center justify-center text-white border-0"
      title="Catálogos Vehiculares"
    >
      <i class="fa-solid fa-car-side text-base"></i>
    </button>
  </div>

  <!-- Mobile Backdrop Overlay -->
  @if (isMobileSidebarOpen()) {
    <div 
      (click)="closeMobileSidebar()" 
      class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-40 lg:hidden transition-opacity"
    ></div>
  }

  <!-- Desktop & Mobile Sidebar Container -->
  <div 
    class="fixed inset-y-0 left-0 z-50 w-72 lg:static lg:w-64 xl:w-72 lg:z-auto shrink-0 h-full bg-white transition-transform duration-300 ease-in-out lg:translate-x-0 shadow-sm"
    [class.-translate-x-full]="!isMobileSidebarOpen()"
    [class.translate-x-0]="isMobileSidebarOpen()"
  >
    <app-automotores-config-sidebar (closeSidebar)="closeMobileSidebar()"></app-automotores-config-sidebar>
  </div>

  <!-- Config Main Content Area -->
  <div class="flex-1 bg-slate-50 flex flex-col min-w-0 h-full overflow-y-auto custom-scrollbar">
    <router-outlet></router-outlet>
  </div>

</div>
