<aside class="bg-white border-r border-slate-200 flex flex-col justify-between shrink-0 h-full transition-all duration-300 w-full select-none text-slate-700 shadow-xs">
  <div class="flex-1 overflow-y-auto py-4">
    <!-- Separador Categoría -->
    <div class="px-4 mb-3 mt-1">
      <div class="text-[10px] font-extrabold uppercase tracking-wider text-slate-400">
        @if (!isCollapsed()) { Trámites Notariales }
      </div>
    </div>

    <!-- Menú Vertical de Entidades con Identidad Cromática Cohesiva -->
    <ul class="space-y-1.5 px-2.5">
      <!-- 1. Mis Solicitudes (Identidad: Azul Petróleo / Teal Institucional Cauca) -->
      <li>
        <a
          routerLink="/registros/entidades/solicitudes"
          routerLinkActive="active-solicitudes"
          class="sidebar-item flex items-center space-x-3 px-3 py-2.5 text-xs text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all rounded-xl border-l-4 border-transparent group relative"
          [title]="isCollapsed() ? (devueltasCount() > 0 ? 'Mis Solicitudes (' + devueltasCount() + ' devueltas)' : 'Mis Solicitudes') : ''"
        >
          <div class="item-icon w-8 h-8 rounded-lg bg-teal-50 text-teal-700 border border-teal-200/80 group-hover:bg-teal-600 group-hover:text-white group-hover:border-teal-600 flex items-center justify-center shrink-0 transition-all shadow-xs">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
            </svg>
          </div>
          @if (!isCollapsed()) {
            <span class="truncate flex-1 tracking-wide font-medium">Mis Solicitudes</span>
            @if (devueltasCount() > 0) {
              <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-black bg-rose-500 text-white shadow-xs animate-pulse" title="Trámites devueltos pendientes de subsanar">
                {{ devueltasCount() }}
              </span>
            }
          } @else if (devueltasCount() > 0) {
            <span class="absolute top-2 right-2 w-2.5 h-2.5 rounded-full bg-rose-500 ring-2 ring-white animate-pulse"></span>
          }
        </a>
      </li>

      <!-- 2. Mis Liquidaciones (Identidad: Verde Esmeralda Fiscal Cauca) -->
      <li>
        <a
          routerLink="/registros/entidades/liquidaciones"
          routerLinkActive="active-liquidaciones"
          class="sidebar-item flex items-center space-x-3 px-3 py-2.5 text-xs text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all rounded-xl border-l-4 border-transparent group relative"
          [title]="isCollapsed() ? 'Mis Liquidaciones' : ''"
        >
          <div class="item-icon w-8 h-8 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-200/80 group-hover:bg-emerald-600 group-hover:text-white group-hover:border-emerald-600 flex items-center justify-center shrink-0 transition-all shadow-xs">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25Z" />
            </svg>
          </div>
          @if (!isCollapsed()) {
            <span class="truncate flex-1 tracking-wide font-medium">Mis Liquidaciones</span>
          }
        </a>
      </li>
    </ul>
  </div>

  <!-- Botón Contraer Menú -->
  <div class="p-3 border-t border-slate-100 shrink-0">
    <button
      (click)="toggleCollapse.emit()"
      class="flex items-center gap-2.5 px-3 py-2 text-xs text-slate-500 hover:text-slate-900 hover:bg-slate-100/80 rounded-lg w-full transition cursor-pointer"
      [title]="isCollapsed() ? 'Expandir menú' : 'Contraer menú'"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="w-4 h-4 shrink-0 transition-transform" [class.rotate-180]="isCollapsed()">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
      </svg>
      @if (!isCollapsed()) {
        <span class="font-medium">Contraer menú</span>
      }
    </button>
  </div>
</aside>
