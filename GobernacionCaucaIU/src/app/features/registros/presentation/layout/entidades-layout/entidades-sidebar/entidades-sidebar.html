<aside class="bg-white border-r border-slate-200 flex flex-col justify-between shrink-0 h-full transition-all duration-300 w-full select-none">
  <div class="flex-1 overflow-y-auto py-3">
    <!-- Botón Prominente Wizard (Call to Action) -->
    <div class="px-3 mb-4">
      <a
        routerLink="/registros/entidades/solicitudes/wizard"
        class="flex items-center justify-center gap-2.5 w-full py-2.5 px-3 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-700 text-white font-semibold text-xs shadow-md shadow-emerald-700/20 hover:from-emerald-500 hover:to-teal-600 hover:shadow-lg transition-all duration-200 active:scale-[0.98] group"
        [title]="isCollapsed() ? 'Nueva Solicitud (Wizard)' : ''"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0 transition-transform group-hover:scale-110" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        @if (!isCollapsed()) {
          <span class="tracking-wide">Nueva Solicitud</span>
        }
      </a>
    </div>

    <!-- Separador -->
    <div class="px-4 mb-2">
      <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">
        @if (!isCollapsed()) { Trámites Notariales }
      </div>
    </div>

    <!-- Menú Vertical de Entidades -->
    <ul class="space-y-1 px-2">
      <li>
        <a
          routerLink="/registros/entidades/solicitudes"
          routerLinkActive="bg-emerald-50 text-emerald-900 font-semibold border-l-4 border-emerald-600 shadow-xs"
          class="flex items-center space-x-3 px-3.5 py-2.5 text-xs text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all rounded-r-lg border-l-4 border-transparent group"
          [title]="isCollapsed() ? 'Mis Solicitudes' : ''"
        >
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="w-5 h-5 text-slate-500 group-hover:text-emerald-700 shrink-0">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
          </svg>
          @if (!isCollapsed()) {
            <span class="truncate">Mis Solicitudes</span>
          }
        </a>
      </li>

      <li>
        <a
          routerLink="/registros/entidades/liquidaciones"
          routerLinkActive="bg-emerald-50 text-emerald-900 font-semibold border-l-4 border-emerald-600 shadow-xs"
          class="flex items-center space-x-3 px-3.5 py-2.5 text-xs text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all rounded-r-lg border-l-4 border-transparent group"
          [title]="isCollapsed() ? 'Mis Liquidaciones' : ''"
        >
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="w-5 h-5 text-slate-500 group-hover:text-emerald-700 shrink-0">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25Z" />
          </svg>
          @if (!isCollapsed()) {
            <span class="truncate">Mis Liquidaciones</span>
          }
        </a>
      </li>
    </ul>
  </div>

  <!-- Botón Contraer Menú -->
  <div class="p-3 border-t border-slate-100 shrink-0">
    <button
      (click)="toggleCollapse.emit()"
      class="flex items-center gap-2.5 px-3 py-2 text-xs text-slate-500 hover:text-slate-900 hover:bg-slate-50 rounded-lg w-full transition cursor-pointer"
      [title]="isCollapsed() ? 'Expandir menú' : 'Contraer menú'"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="w-4 h-4 shrink-0 transition-transform" [class.rotate-180]="isCollapsed()">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
      </svg>
      @if (!isCollapsed()) {
        <span>Contraer menú</span>
      }
    </button>
  </div>
</aside>
