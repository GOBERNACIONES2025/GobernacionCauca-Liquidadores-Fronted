<header class="h-16 bg-[#0f3a47] text-white flex items-center justify-between px-4 z-20 border-b border-teal-900/60 shadow-md shrink-0 w-full relative">
  <!-- Left Side: Toggle button, Brand & Title -->
  <div class="flex items-center space-x-3">
    <button 
      (click)="toggleSidebar.emit()"
      type="button"
      class="p-2 rounded-lg bg-teal-950/40 text-teal-200 hover:text-white hover:bg-teal-900/60 focus:outline-none transition cursor-pointer"
      title="Alternar Menú"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
      </svg>
    </button>

    <div class="flex items-center space-x-3">
      <div class="h-9 px-2.5 py-0.5 bg-white rounded-lg flex items-center justify-center shadow-xs">
        <img src="/Logo_gov_cauca.png" alt="Gobernación del Cauca" class="h-7 w-auto object-contain" />
      </div>
      <div class="flex flex-col">
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold tracking-wider text-teal-200 uppercase leading-none">Ventanilla Única Notarial</span>
          <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
            Entidad Externa
          </span>
        </div>
        <span class="text-[11px] text-teal-100/80 font-medium">Impuesto de Registro Departamental</span>
      </div>
    </div>

    <!-- Breadcrumb -->
    <div class="hidden lg:flex items-center pl-4 ml-4 border-l border-teal-800/60">
      <app-breadcrumb theme="dark" />
    </div>
  </div>

  <!-- Right Side: User Profile & Actions -->
  <div class="flex items-center space-x-3">
    <!-- User Profile Dropdown -->
    <div class="relative">
      <button
        (click)="toggleProfileMenu()"
        type="button"
        class="flex items-center space-x-2.5 p-1.5 rounded-lg hover:bg-teal-900/40 transition focus:outline-none cursor-pointer text-left"
      >
        <div class="w-8 h-8 rounded-full bg-emerald-500 text-teal-950 font-bold text-xs flex items-center justify-center shadow-sm">
          {{ userInitials() }}
        </div>
        <div class="hidden sm:flex flex-col text-left">
          <span class="text-xs font-semibold text-white leading-tight">{{ userName() }}</span>
          <span class="text-[10px] text-teal-200/80 leading-none mt-0.5">{{ userRole() }}</span>
        </div>
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-3.5 h-3.5 text-teal-300">
          <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
        </svg>
      </button>

      @if (isProfileMenuOpen()) {
        <div class="absolute right-0 mt-2 w-56 bg-slate-900 rounded-xl shadow-2xl py-1.5 border border-slate-700 z-30 text-xs">
          <div class="px-4 py-2 border-b border-slate-800 flex flex-col gap-0.5">
            <span class="font-bold text-white leading-tight">{{ userName() }}</span>
            <span class="text-[10px] text-teal-400">Ventanilla Radicadora Externa</span>
          </div>

          <a routerLink="/registros/entidades/solicitudes" (click)="isProfileMenuOpen.set(false)" class="block px-4 py-2 text-slate-200 hover:bg-slate-800 font-medium">
            <i class="fa-solid fa-folder-open text-emerald-400 mr-2"></i>Mis Solicitudes
          </a>
          <a routerLink="/registros/entidades/liquidaciones" (click)="isProfileMenuOpen.set(false)" class="block px-4 py-2 text-slate-200 hover:bg-slate-800 font-medium">
            <i class="fa-solid fa-file-invoice text-teal-400 mr-2"></i>Mis Liquidaciones
          </a>

          <div class="border-t border-slate-800 my-1"></div>

          <button
            (click)="logout(); isProfileMenuOpen.set(false)"
            type="button"
            class="w-full text-left block px-4 py-2 text-rose-400 hover:bg-slate-800 font-medium cursor-pointer"
          >
            <i class="fa-solid fa-right-from-bracket text-rose-400 mr-2"></i>Cerrar Sesión Entidad
          </button>
        </div>
      }
    </div>
  </div>
</header>
