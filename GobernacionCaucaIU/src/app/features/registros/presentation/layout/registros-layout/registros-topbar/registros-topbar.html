<header class="h-14 bg-base-100 border-b border-slate-200/80 flex items-center justify-between px-4 sm:px-6 shrink-0 w-full z-10 relative">
  
  <!-- Left Side: Toggle button, Title & Date -->
  <div class="flex items-center gap-3">
    <button 
      (click)="toggleSidebar.emit()"
      class="p-1.5 text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-md transition-colors"
      title="Alternar menú">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
      </svg>
    </button>
    <div class="flex flex-col">
      <h1 class="text-sm font-bold text-slate-800 leading-tight">Configuración de Registros</h1>
      <span class="text-[11px] text-slate-400 hidden sm:inline">Vigencia 2026 • Gobernación del Cauca</span>
    </div>
  </div>


  <!-- Right Side: Actions & Profile -->
  <div class="flex items-center gap-3">
    
    <button class="btn btn-outline btn-sm text-primary border-primary hover:bg-primary hover:text-white font-medium">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" /></svg>
      Editar registro
    </button>
    
    <button class="btn btn-primary btn-sm font-medium">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
      Nueva categoría
    </button>

    <div class="divider divider-horizontal mx-0"></div>

    <button class="btn btn-circle btn-ghost btn-sm relative text-base-content/70">
      <div class="badge badge-warning badge-xs absolute top-0 right-0"></div>
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" /></svg>
    </button>

    <div class="dropdown dropdown-end">
      <div tabindex="0" role="button" class="flex items-center gap-2 hover:bg-base-200 p-1 pr-2 rounded-full transition-colors">
        <div class="avatar placeholder">
          <div class="bg-primary text-primary-content rounded-full w-8 font-bold text-xs">
            LA
          </div>
        </div>
        <div class="flex flex-col text-left hidden sm:flex">
          <span class="text-sm font-bold text-base-content leading-none">Luis Ángel Mora</span>
          <span class="text-[10px] text-base-content/60 leading-none mt-1">Liquidador - Sede Central</span>
        </div>
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 text-base-content/50"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" /></svg>
      </div>
      <ul tabindex="0" class="dropdown-content z-[1] menu p-2 shadow bg-base-100 rounded-box w-52 mt-4 border border-base-200">
        <li><a>Perfil</a></li>
        <li><a>Ajustes</a></li>
        <li><a class="text-error">Cerrar Sesión</a></li>
      </ul>
    </div>

  </div>
</header>
