<div class="flex h-full w-full relative overflow-hidden bg-base-100">
  
  <!-- Mobile Toggle Button (Visible on screens < lg) -->
  <div class="lg:hidden fixed bottom-4 left-4 z-40">
    <button 
      (click)="toggleMobileSidebar()" 
      class="btn btn-circle btn-primary shadow-lg flex items-center justify-center text-white"
      title="Catálogos"
    >
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
        <polyline points="2 17 12 22 22 17"></polyline>
        <polyline points="2 12 12 17 22 12"></polyline>
      </svg>
    </button>
  </div>

  <!-- Mobile Backdrop Overlay -->
  @if (isMobileSidebarOpen()) {
    <div 
      (click)="closeMobileSidebar()" 
      class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-40 lg:hidden transition-opacity"
    ></div>
  }

  <!-- Desktop & Mobile Sidebar Container -->
  <div 
    class="fixed inset-y-0 left-0 z-50 w-72 lg:static lg:w-64 xl:w-72 lg:z-auto shrink-0 h-full bg-base-100 transition-transform duration-300 ease-in-out lg:translate-x-0"
    [class.-translate-x-full]="!isMobileSidebarOpen()"
    [class.translate-x-0]="isMobileSidebarOpen()"
  >
    <app-config-sidebar (closeSidebar)="closeMobileSidebar()"></app-config-sidebar>
  </div>

  <!-- Config Main Content Area -->
  <div class="flex-1 bg-base-100 flex flex-col min-w-0 h-full overflow-y-auto custom-scrollbar">
    <router-outlet></router-outlet>
  </div>

</div>
