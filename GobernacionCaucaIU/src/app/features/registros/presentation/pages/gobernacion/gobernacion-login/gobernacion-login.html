<div class="relative w-full min-h-screen bg-slate-950 flex items-center justify-center lg:justify-start p-4 md:p-8 lg:pl-20 overflow-hidden font-sans select-none">
  <!-- Decorative background elements (Navy & Royal Blue Theme) -->
  <div class="absolute -top-40 -right-40 w-[650px] h-[650px] bg-gradient-to-br from-blue-700/30 to-indigo-950/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-40 -left-40 w-[650px] h-[650px] bg-gradient-to-tr from-sky-600/20 to-slate-900/30 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Login Card Container -->
  <div class="relative z-10 w-full max-w-md bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl p-8 border border-white/20">
    
    <!-- Header / Brand -->
    <div class="text-center mb-6">
      <div class="flex justify-center mb-3">
        <img 
          src="/Logo_gov_cauca.png" 
          alt="Gobernación del Cauca" 
          class="h-16 w-auto object-contain drop-shadow-sm select-none" 
        />
      </div>
      <div class="inline-block px-3 py-1 bg-blue-100 text-blue-900 text-[11px] font-bold uppercase rounded-full mb-1.5 tracking-wider">
        Portal Institucional
      </div>
      <h1 class="text-xl font-black text-slate-800">Gobernación del Cauca</h1>
      <p class="text-xs text-slate-500 mt-1">Secretaría de Hacienda - Fiscalización y Rentas Departamentales</p>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Funcionario / Usuario</label>
        <div class="relative">
          <input 
            type="text" 
            formControlName="usuario" 
            placeholder="Ingrese su usuario o correo institucional"
            class="w-full px-3.5 py-2.5 text-xs bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600 focus:bg-white outline-none transition"
          />
          <span class="absolute right-3 top-2.5 text-slate-400 text-xs"><i class="fa-solid fa-user-shield"></i></span>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Contraseña Institucional</label>
        <div class="relative">
          <input 
            [type]="showPassword() ? 'text' : 'password'" 
            formControlName="clave" 
            placeholder="••••••••"
            class="w-full px-3.5 py-2.5 text-xs bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600 focus:bg-white outline-none transition"
          />
          <button 
            type="button" 
            (click)="togglePassword()" 
            class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600 text-xs cursor-pointer"
          >
            <i [class]="showPassword() ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
          </button>
        </div>
      </div>

      <button 
        type="submit" 
        [disabled]="isLoading()"
        class="w-full py-2.5 px-4 bg-gradient-to-r from-blue-700 to-indigo-800 hover:from-blue-600 hover:to-indigo-700 text-white font-bold text-xs rounded-xl shadow-lg shadow-blue-700/25 transition active:scale-[0.98] cursor-pointer flex items-center justify-center gap-2 mt-2"
      >
        @if (isLoading()) {
          <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
          <span>Autenticando funcionario...</span>
        } @else {
          <i class="fa-solid fa-shield-halved"></i>
          <span>Ingresar al Portal Institucional</span>
        }
      </button>
    </form>

    <!-- Footer Switcher to Entidades -->
    <div class="mt-6 pt-4 border-t border-slate-100 text-center">
      <span class="text-[11px] text-slate-500">¿Representa a una Notaría o Entidad Externa?</span>
      <a routerLink="/registros/entidades/login" class="block mt-1 text-xs font-bold text-emerald-700 hover:text-emerald-800 hover:underline">
        Ir a la Ventanilla Notarial y Registral &rarr;
      </a>
    </div>

  </div>
</div>
