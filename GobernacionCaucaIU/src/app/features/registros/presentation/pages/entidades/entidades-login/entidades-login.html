<div class="relative w-full min-h-screen bg-slate-900 flex items-center justify-center lg:justify-start p-4 md:p-8 lg:pl-20 overflow-hidden font-sans select-none">
  <!-- Decorative background elements (Emerald & Teal Theme) -->
  <div class="absolute -top-40 -right-40 w-[600px] h-[600px] bg-gradient-to-br from-emerald-600/30 to-teal-800/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-40 -left-40 w-[600px] h-[600px] bg-gradient-to-tr from-teal-700/20 to-emerald-950/20 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Login Card Container -->
  <div class="relative z-10 w-full max-w-md bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl p-8 border border-white/20">
    
    <!-- Header / Brand -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center p-3 bg-gradient-to-br from-emerald-500 to-teal-700 rounded-2xl shadow-lg shadow-emerald-600/25 mb-3 text-white">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
        </svg>
      </div>
      <div class="inline-block px-3 py-1 bg-emerald-100 text-emerald-800 text-[11px] font-bold uppercase rounded-full mb-1.5 tracking-wider">
        Ventanilla Única Notarial
      </div>
      <h1 class="text-xl font-black text-slate-800">Entidades Externas</h1>
      <p class="text-xs text-slate-500 mt-1">Radicación y Liquidación de Actos y Escrituras Notariales</p>
    </div>

    <!-- Quick Access Demo Buttons -->
    <div class="mb-5 bg-slate-50 p-3 rounded-xl border border-slate-200/80">
      <span class="text-[10px] font-bold uppercase text-slate-500 block mb-2 tracking-wider">Acceso Rápido Demostración:</span>
      <div class="grid grid-cols-2 gap-1.5">
        <button 
          type="button" 
          (click)="fillDemo('Notaría 1 de Popayán', 'notaria1_popayan', 1)"
          class="text-left px-2.5 py-1.5 text-[11px] font-medium bg-white hover:bg-emerald-50 hover:text-emerald-800 border border-slate-200 rounded-lg transition text-slate-700 cursor-pointer flex items-center justify-between"
        >
          <span>Notaría 1 Popayán</span>
          <i class="fa-solid fa-arrow-right text-[9px] text-slate-400"></i>
        </button>
        <button 
          type="button" 
          (click)="fillDemo('Notaría 2 de Popayán', 'notaria2_popayan', 2)"
          class="text-left px-2.5 py-1.5 text-[11px] font-medium bg-white hover:bg-emerald-50 hover:text-emerald-800 border border-slate-200 rounded-lg transition text-slate-700 cursor-pointer flex items-center justify-between"
        >
          <span>Notaría 2 Popayán</span>
          <i class="fa-solid fa-arrow-right text-[9px] text-slate-400"></i>
        </button>
        <button 
          type="button" 
          (click)="fillDemo('Cámara de Comercio', 'camara_comercio', 3)"
          class="text-left px-2.5 py-1.5 text-[11px] font-medium bg-white hover:bg-emerald-50 hover:text-emerald-800 border border-slate-200 rounded-lg transition text-slate-700 cursor-pointer flex items-center justify-between"
        >
          <span>Cámara Comercio</span>
          <i class="fa-solid fa-arrow-right text-[9px] text-slate-400"></i>
        </button>
        <button 
          type="button" 
          (click)="fillDemo('ORIP Popayán', 'orip_popayan', 4)"
          class="text-left px-2.5 py-1.5 text-[11px] font-medium bg-white hover:bg-emerald-50 hover:text-emerald-800 border border-slate-200 rounded-lg transition text-slate-700 cursor-pointer flex items-center justify-between"
        >
          <span>ORIP Popayán</span>
          <i class="fa-solid fa-arrow-right text-[9px] text-slate-400"></i>
        </button>
      </div>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Usuario / Código Notarial</label>
        <div class="relative">
          <input 
            type="text" 
            formControlName="usuario" 
            placeholder="Ej. notaria1_popayan"
            class="w-full px-3.5 py-2.5 text-xs bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none transition"
          />
          <span class="absolute right-3 top-2.5 text-slate-400 text-xs"><i class="fa-solid fa-building-columns"></i></span>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Contraseña de Acceso</label>
        <div class="relative">
          <input 
            [type]="showPassword() ? 'text' : 'password'" 
            formControlName="clave" 
            placeholder="••••••••"
            class="w-full px-3.5 py-2.5 text-xs bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none transition"
          />
          <button 
            type="button" 
            (click)="togglePassword()" 
            class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600 text-xs cursor-pointer"
          >
            <i [class]="showPassword() ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
          </button>
        </div>
      </div>

      <button 
        type="submit" 
        [disabled]="isLoading()"
        class="w-full py-2.5 px-4 bg-gradient-to-r from-emerald-600 to-teal-700 hover:from-emerald-500 hover:to-teal-600 text-white font-bold text-xs rounded-xl shadow-lg shadow-emerald-700/25 transition active:scale-[0.98] cursor-pointer flex items-center justify-center gap-2 mt-2"
      >
        @if (isLoading()) {
          <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
          <span>Validando credenciales...</span>
        } @else {
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>Ingresar a la Ventanilla</span>
        }
      </button>
    </form>

    <!-- Footer Switcher to Gobernación -->
    <div class="mt-6 pt-4 border-t border-slate-100 text-center">
      <span class="text-[11px] text-slate-500">¿Es funcionario de la Gobernación?</span>
      <a routerLink="/registros/gobernacion/login" class="block mt-1 text-xs font-bold text-blue-700 hover:text-blue-800 hover:underline">
        Ir al Portal Institucional de la Gobernación &rarr;
      </a>
    </div>

  </div>
</div>
