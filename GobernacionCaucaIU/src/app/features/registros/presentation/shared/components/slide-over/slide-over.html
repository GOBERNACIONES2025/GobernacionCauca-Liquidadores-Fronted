@if (isOpen) {
  <!-- Modal Container & Backdrop -->
  <div 
    class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 overflow-y-auto bg-slate-900/60 backdrop-blur-xs transition-opacity duration-200"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title"
    (click)="close()"
  >
    <!-- Centered Modal Card -->
    <div 
      class="bg-white rounded-2xl shadow-2xl w-full border border-slate-200 flex flex-col overflow-hidden my-auto transform transition-all duration-200 ease-out"
      [class.max-w-md]="size === 'sm'"
      [class.max-w-lg]="size === 'md'"
      [class.max-w-2xl]="size === 'lg'"
      [class.max-w-4xl]="size === 'xl'"
      (click)="$event.stopPropagation()"
    >
      <!-- Modal Header -->
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-white shrink-0">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-blue-50 text-blue-700 flex items-center justify-center shrink-0 border border-blue-100 shadow-xs">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />
            </svg>
          </div>
          <div>
            <h2 class="text-base font-bold text-slate-900 tracking-tight">{{ title }}</h2>
            @if (description) {
              <p class="text-xs text-slate-500 mt-0.5">{{ description }}</p>
            }
          </div>
        </div>
        <button 
          (click)="close()" 
          [disabled]="isSaving"
          type="button"
          class="text-slate-400 hover:text-slate-600 disabled:opacity-40 p-2 rounded-lg hover:bg-slate-100 transition cursor-pointer focus:ring-2 focus:ring-blue-500 focus:outline-none"
          title="Cerrar modal (Esc)">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Modal Form Body -->
      <div class="p-6 overflow-y-auto max-h-[70vh] bg-slate-50/50 custom-scrollbar">
        <ng-content></ng-content>
      </div>

      <!-- Modal Footer Actions -->
      <div class="px-6 py-3.5 border-t border-slate-100 bg-white flex items-center justify-end gap-2.5 shrink-0">
        <button 
          (click)="close()" 
          [disabled]="isSaving"
          type="button"
          class="px-4 py-2 text-xs font-bold text-slate-600 hover:bg-slate-100 disabled:opacity-50 rounded-xl transition cursor-pointer focus:ring-2 focus:ring-slate-400 focus:outline-none">
          Cancelar
        </button>
        <button 
          (click)="save()" 
          type="button"
          class="px-5 py-2 text-xs font-bold bg-[#0f3b73] hover:bg-[#0a274d] disabled:opacity-50 disabled:cursor-not-allowed text-white rounded-xl shadow-xs transition active:scale-[0.98] cursor-pointer inline-flex items-center gap-1.5 focus:ring-2 focus:ring-blue-600 focus:outline-none"
          [disabled]="isSaving">
          @if (isSaving) {
            <svg class="animate-spin -ml-1 mr-1 h-3.5 w-3.5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Guardando...</span>
          } @else {
            <span>{{ saveButtonText || 'Guardar' }}</span>
          }
        </button>
      </div>
    </div>
  </div>
}
