<!-- Backdrop -->
<div 
  class="fixed inset-0 bg-neutral/40 backdrop-blur-sm z-40 transition-opacity duration-300"
  [class.opacity-100]="isOpen"
  [class.opacity-0]="!isOpen"
  [class.pointer-events-none]="!isOpen"
  (click)="close()">
</div>

<!-- Slide-Over Panel -->
<div 
  class="fixed inset-y-0 right-0 z-50 w-full max-w-md bg-base-100 shadow-2xl flex flex-col transform transition-transform duration-300 ease-in-out"
  [class.translate-x-0]="isOpen"
  [class.translate-x-full]="!isOpen">
  
  <!-- Header -->
  <div class="px-6 py-4 border-b border-base-200 flex items-center justify-between bg-base-100 shrink-0">
    <div>
      <h2 class="text-lg font-bold text-base-content">{{ title }}</h2>
      @if (description) {
        <p class="text-xs text-base-content/60 mt-0.5">{{ description }}</p>
      }
    </div>
    <button (click)="close()" class="btn btn-sm btn-circle btn-ghost text-base-content/50 hover:text-base-content">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
    </button>
  </div>

  <!-- Dynamic Content (Forms will be injected here) -->
  <div class="flex-1 overflow-y-auto p-6 bg-base-200/30">
    <ng-content></ng-content>
  </div>

  <!-- Footer Actions -->
  <div class="p-4 border-t border-base-200 bg-base-100 flex justify-end gap-3 shrink-0">
    <button (click)="close()" class="btn btn-sm btn-ghost font-medium">Cancelar</button>
    <button (click)="save()" class="btn btn-sm btn-primary font-bold" [disabled]="isSaving">
      @if (isSaving) {
        <span class="loading loading-spinner loading-xs"></span>
      }
      Guardar
    </button>
  </div>
</div>
