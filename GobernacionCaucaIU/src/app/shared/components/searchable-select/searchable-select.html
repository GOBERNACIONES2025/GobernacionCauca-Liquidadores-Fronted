<div class="relative w-full">
  <!-- Trigger Button / Display -->
  <div 
    class="flex items-center justify-between w-full border border-gray-300 rounded-md px-3 py-2 bg-white cursor-pointer focus-within:ring-2 focus-within:ring-primary focus-within:border-primary transition-all shadow-sm"
    [class.bg-gray-100]="disabled"
    [class.cursor-not-allowed]="disabled"
    (click)="toggleDropdown()"
  >
    <div class="flex-1 truncate select-none text-sm" [class.text-gray-400]="!displayValue">
      {{ displayValue || placeholder }}
    </div>
    
    <div class="flex items-center gap-1">
      <button 
        *ngIf="value && !disabled" 
        type="button" 
        (click)="clearSelection($event)"
        class="text-gray-400 hover:text-red-500 focus:outline-none p-1 rounded-full hover:bg-gray-100 transition-colors"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
        </svg>
      </button>

      <svg 
        xmlns="http://www.w3.org/2000/svg" 
        class="h-4 w-4 text-gray-500 transition-transform duration-200" 
        [class.rotate-180]="isOpen()"
        viewBox="0 0 20 20" 
        fill="currentColor"
      >
        <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
      </svg>
    </div>
  </div>

  <!-- Dropdown Panel -->
  <div 
    *ngIf="isOpen()"
    class="absolute z-50 w-full mt-1 bg-white border border-gray-200 rounded-md shadow-lg max-h-60 flex flex-col overflow-hidden"
  >
    <!-- Search Input -->
    <div class="p-2 border-b border-gray-100 bg-gray-50 flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      <input 
        #searchInput
        type="text" 
        [value]="searchTerm"
        (input)="onSearch($event)"
        class="w-full text-sm bg-transparent border-none focus:ring-0 p-1 outline-none"
        placeholder="Buscar..."
        (click)="$event.stopPropagation()"
      >
    </div>

    <!-- Options List -->
    <ul class="overflow-y-auto flex-1 py-1">
      <li *ngIf="isLoading()" class="px-4 py-3 text-sm text-gray-500 flex items-center justify-center gap-2">
        <span class="loading loading-spinner loading-xs text-primary"></span>
        Cargando...
      </li>
      
      <li *ngIf="!isLoading() && options().length === 0" class="px-4 py-3 text-sm text-gray-500 text-center">
        No se encontraron resultados
      </li>

      <li 
        *ngFor="let option of options()" 
        (click)="selectOption(option, $event)"
        class="px-4 py-2 text-sm cursor-pointer hover:bg-gray-100 transition-colors flex items-center justify-between"
        [class.bg-blue-50]="option[valueKey] === value"
        [class.text-primary]="option[valueKey] === value"
        [class.font-medium]="option[valueKey] === value"
      >
        <span>{{ option[labelKey] }}</span>
        <svg *ngIf="option[valueKey] === value" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
        </svg>
      </li>
    </ul>
  </div>
</div>
