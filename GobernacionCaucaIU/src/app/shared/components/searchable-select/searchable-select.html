<div class="relative w-full">
  <!-- Trigger Button / Display -->
  <div 
    tabindex="0"
    role="combobox"
    [attr.aria-expanded]="isOpen()"
    (keydown)="onTriggerKeyDown($event)"
    (click)="toggleDropdown()"
    class="flex items-center justify-between w-full h-10 border rounded-lg px-3 py-2 bg-white cursor-pointer transition-all shadow-xs focus:outline-none focus:ring-2 focus:ring-[#0f3b73] focus:border-[#0f3b73]"
    [class.border-slate-300]="!isInvalid"
    [class.border-red-500]="isInvalid"
    [class.bg-slate-100]="disabled"
    [class.cursor-not-allowed]="disabled"
  >
    <div class="flex-1 truncate select-none text-xs font-semibold text-slate-800" [class.text-slate-400]="!displayValue">
      {{ displayValue || placeholder }}
    </div>
    
    <div class="flex items-center gap-1 shrink-0 ml-1.5">
      <button 
        *ngIf="value && !disabled" 
        type="button" 
        (click)="clearSelection($event)"
        class="text-slate-400 hover:text-red-500 focus:outline-none p-1 rounded-full hover:bg-slate-100 transition-colors"
        title="Limpiar selección"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
        </svg>
      </button>

      <svg 
        xmlns="http://www.w3.org/2000/svg" 
        class="h-4 w-4 text-slate-500 transition-transform duration-200" 
        [class.rotate-180]="isOpen()"
        viewBox="0 0 20 20" 
        fill="currentColor"
      >
        <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
      </svg>
    </div>
  </div>

  <!-- Dropdown Panel -->
  <div 
    *ngIf="isOpen()"
    class="absolute z-50 w-full mt-1 bg-white border border-slate-200 rounded-lg shadow-xl max-h-64 flex flex-col overflow-hidden animate-fadeIn"
  >
    <!-- Search Input Header -->
    <div class="p-2 border-b border-slate-200 bg-slate-50 flex items-center gap-1.5" (click)="$event.stopPropagation()">
      <div class="relative flex-1 flex items-center">
        <div class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none text-slate-400">
          <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
          </svg>
        </div>
        <input 
          #searchInput
          type="text" 
          [value]="searchTerm"
          (input)="onSearchInput($event)"
          (keydown)="onSearchKeyDown($event)"
          class="w-full pl-8 pr-7 py-1.5 text-xs bg-white border border-slate-300 rounded-md text-slate-800 placeholder-slate-400 focus:outline-none focus:border-[#0f3b73] focus:ring-1 focus:ring-[#0f3b73] transition-colors"
          placeholder="Escriba para buscar por coincidencia..."
        >
        <button 
          *ngIf="searchTerm"
          type="button"
          (click)="clearSearch($event)"
          class="absolute inset-y-0 right-0 pr-2 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <button 
        *ngIf="searchFn && !items"
        type="button"
        (click)="onSearchSubmit($event)"
        [disabled]="isLoading()"
        class="inline-flex items-center gap-1 px-2.5 py-1.5 bg-[#0f3b73] hover:bg-[#0a274d] text-white text-xs font-semibold rounded-md shadow-xs transition-colors shrink-0 disabled:opacity-50 cursor-pointer">
        <svg *ngIf="!isLoading()" class="w-3 h-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
        </svg>
        <span *ngIf="isLoading()" class="fa-solid fa-circle-notch fa-spin text-xs"></span>
        <span>Buscar</span>
      </button>
    </div>

    <!-- Options List -->
    <ul #optionsList class="overflow-y-auto flex-1 py-1 max-h-48 divide-y divide-slate-100">
      <li *ngIf="isLoading()" class="px-4 py-3 text-xs text-slate-500 flex items-center justify-center gap-2">
        <i class="fa-solid fa-circle-notch fa-spin text-[#0f3b73]"></i>
        Cargando opciones...
      </li>
      
      <li *ngIf="!isLoading() && options().length === 0" class="px-4 py-3 text-xs text-slate-500 text-center font-medium">
        No se encontraron coincidencias
      </li>

      <li 
        *ngFor="let option of paginatedOptions(); let i = index" 
        (click)="selectOption(option, $event)"
        (mouseenter)="highlightedIndex.set(i)"
        class="px-3.5 py-2 text-xs cursor-pointer hover:bg-slate-100 transition-colors flex items-center justify-between gap-2"
        [class.is-highlighted]="highlightedIndex() === i"
        [class.bg-slate-100]="highlightedIndex() === i && option[valueKey] !== value"
        [class.bg-blue-50]="option[valueKey] === value"
        [class.text-[#0f3b73]]="option[valueKey] === value"
        [class.font-bold]="option[valueKey] === value"
        [class.font-medium]="option[valueKey] !== value"
        [class.text-slate-800]="option[valueKey] !== value"
      >
        <span class="truncate">{{ option[labelKey] }}</span>
        <svg *ngIf="option[valueKey] === value" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-[#0f3b73] shrink-0" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
        </svg>
      </li>
    </ul>

    <!-- Pagination Footer -->
    <div 
      *ngIf="enablePagination && totalPages() > 1"
      class="px-3 py-1.5 border-t border-slate-200/80 bg-slate-50 flex items-center justify-between text-[11px] text-slate-500 font-medium select-none"
      (click)="$event.stopPropagation()"
    >
      <button
        type="button"
        (click)="prevPage($event)"
        [disabled]="currentPage() === 1"
        class="px-2 py-0.5 rounded border border-slate-200 bg-white hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed transition cursor-pointer text-slate-700 font-bold inline-flex items-center gap-1 shadow-2xs"
      >
        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        <span>Ant.</span>
      </button>

      <span class="font-mono text-[10px] text-slate-600">
        Pág. <strong class="text-slate-900">{{ currentPage() }}</strong> de {{ totalPages() }} ({{ options().length }})
      </span>

      <button
        type="button"
        (click)="nextPage($event)"
        [disabled]="currentPage() >= totalPages()"
        class="px-2 py-0.5 rounded border border-slate-200 bg-white hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed transition cursor-pointer text-slate-700 font-bold inline-flex items-center gap-1 shadow-2xs"
      >
        <span>Sig.</span>
        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>
</div>
