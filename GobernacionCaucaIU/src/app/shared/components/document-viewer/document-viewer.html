<!-- Modal Backdrop -->
<div 
  class="fixed inset-0 z-[500] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm transition-opacity"
  [class.opacity-0]="!isOpen"
  [class.pointer-events-none]="!isOpen"
  [class.opacity-100]="isOpen"
  (click)="close()">
  
  <!-- Modal Content -->
  <div 
    class="bg-white rounded-xl shadow-2xl w-full max-w-5xl h-[85vh] flex flex-col overflow-hidden transition-transform transform scale-95"
    [class.scale-100]="isOpen"
    (click)="$event.stopPropagation()">
    
    <!-- Header -->
    <div class="px-6 py-3 border-b border-slate-200 flex items-center justify-between shrink-0 bg-slate-50">
      <h3 class="font-bold text-base text-slate-800 flex items-center gap-2 m-0">
        <svg class="w-5 h-5 text-blue-900" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
        </svg>
        {{ title }}
      </h3>
      
      <div class="flex items-center gap-2">
        <!-- Controles de Zoom -->
        <div *ngIf="selectedDoc" class="inline-flex items-center bg-slate-200/80 rounded-lg p-0.5 text-xs font-bold text-slate-700 mr-2 border border-slate-300/60">
          <button (click)="zoomOut()" title="Alejar (Zoom Out)" type="button" class="px-2 py-1 hover:bg-white rounded transition-colors border-none bg-transparent cursor-pointer">
            <i class="fa-solid fa-minus"></i>
          </button>
          <button (click)="resetZoom()" title="Restablecer Zoom (100%)" type="button" class="px-2 py-1 hover:bg-white rounded transition-colors border-none bg-transparent cursor-pointer font-mono">
            {{ zoomLevel }}%
          </button>
          <button (click)="zoomIn()" title="Acercar (Zoom In)" type="button" class="px-2 py-1 hover:bg-white rounded transition-colors border-none bg-transparent cursor-pointer">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>

        <!-- Abrir en Nueva Pestaña / Visor Navegador -->
        <button 
          *ngIf="selectedDoc"
          (click)="openInNewTab()"
          title="Abrir en pestaña nueva con visor del navegador"
          type="button"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-bold text-slate-700 bg-white hover:bg-slate-100 rounded-lg transition-colors border border-slate-300 shadow-2xs cursor-pointer">
          <i class="fa-solid fa-up-right-from-square"></i>
          Abrir en Pestaña
        </button>

        <!-- Imprimir / Guardar PDF (Nativo) -->
        <button 
          *ngIf="selectedDoc"
          (click)="printCurrent()"
          title="Imprimir o Guardar como PDF"
          type="button"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-bold text-white bg-[#1e3a7b] hover:bg-[#152a5a] rounded-lg transition-colors border-none shadow-2xs cursor-pointer">
          <i class="fa-solid fa-print"></i>
          Imprimir / Guardar PDF
        </button>

        <!-- Download Button -->
        <button 
          *ngIf="selectedDoc"
          (click)="downloadCurrent()"
          [disabled]="isDownloading"
          title="Descargar archivo recibo PDF"
          type="button"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-bold text-white bg-[#70b238] hover:bg-[#5f972f] rounded-lg transition-colors border-none shadow-2xs cursor-pointer disabled:opacity-50 disabled:cursor-wait">
          <i [class]="'fa-solid ' + (isDownloading ? 'fa-spinner fa-spin' : 'fa-download')"></i>
          {{ isDownloading ? 'Generando PDF...' : 'Descargar PDF' }}
        </button>
        
        <!-- Close Button -->
        <button 
          (click)="close()" 
          type="button"
          class="p-1.5 text-slate-400 hover:text-slate-700 hover:bg-slate-200/60 rounded-lg transition-colors border-none bg-transparent cursor-pointer ml-1">
          <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Body -->
    <div class="flex flex-1 overflow-hidden">
      
      <!-- Sidebar (Only visible if > 1 document) -->
      <div *ngIf="documentos.length > 1" class="w-64 border-r border-slate-200 bg-slate-50 flex flex-col overflow-y-auto">
        <div class="p-4 text-xs font-bold text-slate-500 uppercase tracking-wider">
          Documentos ({{ documentos.length }})
        </div>
        <ul class="flex-1 overflow-y-auto px-2 pb-4 space-y-1 custom-scrollbar">
          <li *ngFor="let doc of documentos">
            <button 
              (click)="selectDocument(doc)"
              class="w-full text-left px-3 py-2.5 rounded-lg text-sm transition-colors flex flex-col gap-1"
              [class.bg-blue-100]="selectedDoc?.id === doc.id"
              [class.text-blue-900]="selectedDoc?.id === doc.id"
              [class.font-semibold]="selectedDoc?.id === doc.id"
              [class.hover:bg-slate-200]="selectedDoc?.id !== doc.id"
              [class.text-slate-700]="selectedDoc?.id !== doc.id">
              
              <span class="truncate block w-full">{{ doc.nombreArchivo }}</span>
              <span class="text-[10px] text-slate-400 font-mono" *ngIf="doc.tipoArchivo">
                {{ doc.tipoArchivo }}
              </span>
            </button>
          </li>
        </ul>
      </div>

      <!-- Main Viewer Area -->
      <div class="flex-1 bg-slate-200/70 relative overflow-auto p-4 flex justify-center items-start">
        <div *ngIf="!htmlDocContent && !safeUrl" class="absolute inset-0 flex items-center justify-center text-slate-400 text-sm flex-col gap-2">
          <svg class="w-10 h-10 opacity-50" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 0 0 5.636 5.636m12.728 12.728A9 9 0 0 1 5.636 5.636m12.728 12.728L5.636 5.636" />
          </svg>
          No hay documento seleccionado o disponible
        </div>

        <div 
          *ngIf="safeSrcdoc || htmlDocContent" 
          class="w-full h-full min-h-[650px] transition-transform duration-150 origin-top flex justify-center"
          [style.transform]="'scale(' + (zoomLevel / 100) + ')'">
          <iframe 
            [srcdoc]="safeSrcdoc || htmlDocContent" 
            class="w-full max-w-4xl h-full min-h-[700px] border-none shadow-lg rounded-xl bg-white"
            title="Visor de Documentos (HTML)">
          </iframe>
        </div>

        <div 
          *ngIf="!htmlDocContent && safeUrl"
          class="w-full h-full min-h-[650px] transition-transform duration-150 origin-top flex justify-center"
          [style.transform]="'scale(' + (zoomLevel / 100) + ')'">
          <iframe 
            [src]="safeUrl" 
            class="w-full max-w-4xl h-full min-h-[700px] border-none shadow-lg rounded-xl bg-white"
            title="Visor de Documentos (PDF)">
          </iframe>
        </div>
      </div>
      
    </div>
  </div>
</div>
