<nav class="flex items-center flex-wrap gap-1.5 text-xs select-none" aria-label="Miga de pan">
  @for (crumb of breadcrumbs(); track $index; let isLast = $last; let isFirst = $first) {
    <!-- Separador -->
    @if (!isFirst) {
      <i 
        class="fa-solid fa-chevron-right text-[9px] mx-0.5 shrink-0 transition-colors"
        [ngClass]="theme === 'dark' ? 'text-slate-400/80' : 'text-slate-400'"
      ></i>
    }

    <!-- Item Activo (Último) -->
    @if (isLast) {
      <span 
        class="font-semibold truncate max-w-[260px] sm:max-w-none transition-colors"
        [ngClass]="theme === 'dark' ? 'text-white' : 'text-slate-800'"
        aria-current="page"
      >
        @if (isFirst && showHomeIcon) {
          <i class="fa-solid fa-house text-[11px] mr-1.5"></i>
        }
        {{ crumb.label }}
      </span>
    } 
    <!-- Item Enlazable con URL directa -->
    @else if (crumb.url) {
      <a 
        [routerLink]="crumb.url" 
        class="transition-colors duration-150 inline-flex items-center cursor-pointer hover:underline"
        [ngClass]="theme === 'dark' ? 'text-slate-300 hover:text-white' : 'text-slate-500 hover:text-blue-600'"
      >
        @if (isFirst && showHomeIcon) {
          <i class="fa-solid fa-house text-[11px] mr-1.5"></i>
        }
        {{ crumb.label }}
      </a>
    } 
    <!-- Item Enlazable con Fallback dinámico -->
    @else {
      <button 
        type="button" 
        (click)="onItemClick(crumb, $index, $event)" 
        class="transition-colors duration-150 inline-flex items-center cursor-pointer bg-transparent border-none p-0 text-left hover:underline"
        [ngClass]="theme === 'dark' ? 'text-slate-300 hover:text-white' : 'text-slate-500 hover:text-blue-600'"
      >
        @if (isFirst && showHomeIcon) {
          <i class="fa-solid fa-house text-[11px] mr-1.5"></i>
        }
        {{ crumb.label }}
      </button>
    }
  }
</nav>
